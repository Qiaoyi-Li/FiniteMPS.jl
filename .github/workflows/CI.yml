name: CI

on:
  push:
    branches:
      - main
      - dev
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      JULIA_NUM_THREADS: ${{ matrix.version == '1.11' && '1' || '4' }}
    permissions:
      actions: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.11'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - name: Check native MKL thread scope
        if: matrix.version == '1.11'
        uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: '1'
        with:
          test_args: mkl
          coverage: 'false'
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1.11'
      - uses: codecov/codecov-action@v5
        if: matrix.version == '1.11'
        with:
          files: lcov.info
          use_oidc: true
